name: Stable release

# Runs when the release pull request from beta is merged into stable.
on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  version:
    name: Stable version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      last: ${{ steps.version.outputs.last }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: version
        run: |
          bash scripts/version.sh stable | tee -a "$GITHUB_OUTPUT"
          . <(bash scripts/version.sh stable)
          if [ "$releasable" = true ] && ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing **$name** (versionCode $code)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to release on stable." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.version.outputs.name }}
      version_code: ${{ needs.version.outputs.code }}
    secrets: inherit

  publish:
    name: Publish stable release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      NAME: ${{ needs.version.outputs.name }}
      TAG: ${{ needs.version.outputs.tag }}
      LAST: ${{ needs.version.outputs.last }}
      CERT: ${{ needs.build.outputs.certificate }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.version.outputs.name }}
          path: dist

      - name: Write release notes
        run: |
          {
            bash scripts/release-notes.sh "$LAST" HEAD
            echo "## Downloads"
            echo
            echo "Most phones need \`encircle-$NAME-arm64-v8a.apk\`. The \`.aab\` file is the app bundle for Google Play."
            echo "Checksums are in \`SHA256SUMS.txt\`."
            echo
            echo "Signing certificate SHA-256: \`$CERT\`"
            if [ -n "$LAST" ]; then
              echo
              echo "**Full diff:** https://github.com/$GITHUB_REPOSITORY/compare/$LAST...$TAG"
            fi
          } > notes.md

      - name: Publish
        run: >-
          gh release create "$TAG" dist/*
          --target "$GITHUB_SHA" --latest
          --title "Encircle $NAME" --notes-file notes.md
