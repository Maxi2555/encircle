name: Beta release

# Every merge into beta with user-facing changes (feat, fix, perf, refactor, revert, deps)
# publishes a pre-release such as v0.2.0-beta.3. Docs, CI and chore merges are skipped.
on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

# Queue instead of cancel, so every beta number is used exactly once.
concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  version:
    name: Next beta version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      last: ${{ steps.version.outputs.last }}
      releasable: ${{ steps.version.outputs.releasable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: version
        run: |
          bash scripts/version.sh beta > version.env
          cat version.env >> "$GITHUB_OUTPUT"
          while IFS='=' read -r key value; do declare "$key=$value"; done < version.env
          if [ "$releasable" = true ]; then
            echo "Publishing **$name** (versionCode $code)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No user-facing changes since $last, so no beta is published." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: version
    if: needs.version.outputs.releasable == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ github.sha }}
      version_name: ${{ needs.version.outputs.name }}
      version_code: ${{ needs.version.outputs.code }}
    secrets: inherit

  publish:
    name: Publish pre-release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      NAME: ${{ needs.version.outputs.name }}
      TAG: ${{ needs.version.outputs.tag }}
      LAST: ${{ needs.version.outputs.last }}
      CERT: ${{ needs.build.outputs.certificate }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.version.outputs.name }}
          path: dist

      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Pre-release from the **beta** branch. It may contain bugs; please report them in the issues."
            echo
            echo "## Since ${previous:-the beginning}"
            echo
            bash scripts/release-notes.sh "$previous" HEAD
            if [ -n "$LAST" ] && [ "$previous" != "$LAST" ]; then
              echo "<details><summary>All changes since $LAST</summary>"
              echo
              bash scripts/release-notes.sh "$LAST" HEAD
              echo "</details>"
              echo
            fi
            echo "## Downloads"
            echo
            echo "Most phones need \`encircle-$NAME-arm64-v8a.apk\`. Checksums are in \`SHA256SUMS.txt\`."
            echo
            echo "Signing certificate SHA-256: \`$CERT\`"
          } > notes.md

      - name: Publish
        run: >-
          gh release create "$TAG" dist/*
          --target "$GITHUB_SHA" --prerelease
          --title "Encircle $NAME" --notes-file notes.md
