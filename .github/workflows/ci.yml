name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      # Signed with the runner's throwaway debug key: for testing only, cannot update a release install.
      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: encircle-test-apks-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
