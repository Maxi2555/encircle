name: Pull request labels

# Labels by changed area (.github/labeler.yml) and by size. Runs with the base repository's
# configuration and never checks out pull request code, so it is safe for forks.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labels:
    name: Area and size labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

      - uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          xs_label: "size: XS"
          xs_max_size: "10"
          s_label: "size: S"
          s_max_size: "100"
          m_label: "size: M"
          m_max_size: "400"
          l_label: "size: L"
          l_max_size: "1000"
          xl_label: "size: XL"
          files_to_ignore: |
            *.png
            fastlane/metadata/**
          fail_if_xl: "false"
          message_if_xl: >-
            This pull request is very large. Smaller pull requests are reviewed faster;
            please consider splitting it into several focused ones.
