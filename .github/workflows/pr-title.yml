name: Pull request title

# The title becomes the squash commit, which drives version numbers and release notes.
# pull_request_target lets this run for forks too; it never checks out pull request code.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            test
            build
            ci
            chore
            style
          subjectPattern: ^.*[^.]$
          subjectPatternError: >-
            The description "{subject}" in "{title}" should not end with a period.
            See CONTRIBUTING.md, section "Pull request titles".
