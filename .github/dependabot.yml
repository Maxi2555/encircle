version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    # Titles like "build(deps): bump …" pass the title check and trigger a patch beta.
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      androidx-and-compose:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
