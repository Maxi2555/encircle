# Markdown style for the documentation (DavidAnson/markdownlint-cli2).
config:
  default: true
  MD013: false # line length: prose is not hard-wrapped
  MD033: false # inline HTML: README header, <details> blocks
  MD041: false # first line: README starts with a centred HTML block
  MD024:
    siblings_only: true # CHANGELOG repeats "Added", "Fixed" per version

globs:
  - "**/*.md"

ignores:
  - CODE_OF_CONDUCT.md # upstream text, kept verbatim
  - "**/build/**"
  - ".gradle/**"
  - "node_modules/**"
